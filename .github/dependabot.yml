# Dependency update PRs (Andre's locked requirement R3; security sweep 2026-10-30).
# Every PR they open runs the full CI gate, including CI / audit.
# Security updates (Dependabot alerts) are separate and arrive as soon as an
# advisory is published; turn them on in Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR a week for everything that is not a major bump.
      minor-and-patch:
        update-types: [minor, patch]
    # Majors (e.g. next 17, typescript 7) come as their own PRs, not grouped:
    # each is a deliberate upgrade. They are not ignored, because an ignore
    # rule would also hold back a security fix that only ships in a major.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
