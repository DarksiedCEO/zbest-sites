# Phase 6, work order 2.1: the merge gate for main.
#
# Runs typecheck, lint, the lead package's unit tests, the dependency audit
# and the full Playwright e2e gate on every PR to main. Each is its own job so
# branch protection can require them by name:
#   CI / typecheck, CI / lint, CI / unit, CI / audit, CI / e2e
#
# Checkouts set persist-credentials: false: no job pushes, so the token is not
# left in .git/config for later steps (security sweep 2026-10-30, L7).
#
# Third-party actions are pinned to full commit SHAs (tag in the comment), each
# release at least two weeks old when pinned (2026-10-17).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Turbo telemetry off; no remote cache is configured.
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Lead package unit tests (vitest). No database or network: the
  # integration suite (test:integration) is separate and not run here.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Dependency vulnerability scan (Andre's locked requirement R3; security
  # sweep 2026-10-30). Fails on any HIGH or CRITICAL advisory in a production
  # dependency, as resolved in pnpm-lock.yaml. Reads the lockfile and queries
  # the npm registry's advisory API, so no install is needed. Dependabot
  # (.github/dependabot.yml) opens the upgrade PRs that this job then gates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production dependencies, high and critical fail)
        run: pnpm audit --prod --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # desktop-1440 runs on Chromium; mobile-390 uses the iPhone 14 profile,
      # which runs on WebKit.
      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium webkit
      # The gate builds and serves both apps itself (e2e/playwright.config.ts).
      - name: Playwright gate
        run: pnpm e2e
      - name: Upload gate output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-gate-${{ github.sha }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/snapshots/
          retention-days: 30
