# Phase 6, work order 2.1: the merge gate for main.
#
# Runs typecheck, lint, the lead package's unit tests, the dependency audit
# and the full Playwright e2e gate on every PR to main. Each is its own job so
# branch protection can require them by name:
#   CI / typecheck, CI / lint, CI / unit, CI / audit, CI / e2e
#
# The Playwright gate runs as two parallel jobs, one per project
# (e2e-project: desktop-1440 on Chromium, mobile-390 on WebKit). The job
# named `e2e` only aggregates them and fails unless BOTH passed, so the
# required check keeps its name and nothing is weakened (AEGIS F3).
# Nightly accessibility extras: a11y-nightly.yml.
#
# Checkouts set persist-credentials: false: no job pushes, so the token is not
# left in .git/config for later steps (security sweep 2026-10-30, L7).
#
# Third-party actions are pinned to full commit SHAs (tag in the comment), each
# release at least two weeks old when pinned (2026-10-17).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same major as the Vercel runtime (zbm-site-v2 / zbc-site-v1: nodeVersion
  # 24.x), so CI builds and tests on what production runs (AEGIS H-L4).
  NODE_VERSION: "24"
  # Turbo telemetry off; no remote cache is configured.
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Lead package unit tests (vitest). No database or network: the
  # integration suite (test:integration) is separate and not run here.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Dependency vulnerability scan (Andre's locked requirement R3; security
  # sweep 2026-10-30). Fails on any HIGH or CRITICAL advisory in a production
  # dependency, as resolved in pnpm-lock.yaml. Reads the lockfile and queries
  # the npm registry's advisory API, so no install is needed. Dependabot
  # (.github/dependabot.yml) opens the upgrade PRs that this job then gates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production dependencies, high and critical fail)
        run: pnpm audit --prod --audit-level=high

  e2e-project:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Both legs always finish, so one failure never hides the other's.
      fail-fast: false
      matrix:
        include:
          - project: desktop-1440
            browser: chromium
          # The iPhone 14 profile runs on WebKit.
          - project: mobile-390
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.browser }}
      # The gate builds and serves both apps itself (e2e/playwright.config.ts).
      - name: Playwright gate (${{ matrix.project }})
        run: pnpm --filter e2e exec playwright test --project=${{ matrix.project }}
      - name: Upload gate output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-gate-${{ matrix.project }}-${{ github.sha }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/snapshots/
          retention-days: 30

  # The required check. Fails unless every e2e-project leg succeeded —
  # including when one was cancelled, skipped or timed out. No checkout.
  e2e:
    if: ${{ always() }}
    needs: [e2e-project]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both Playwright projects passed
        env:
          RESULT: ${{ needs.e2e-project.result }}
        run: |
          echo "e2e-project (desktop-1440 + mobile-390): $RESULT"
          test "$RESULT" = "success"
