# Secret scan over the whole git history (ZBM Engineering Doctrine §5.5; the repository is public).
# Same pinned tool as zbm-zbc's CI secret-scan job: the gitleaks release binary, checksum-verified, no third-party
# action and no licence key. Default gitleaks rules; there is no allowlist (add exact fake strings only, never paths).
# Baseline: full history scanned clean at 9a7464f (52 commits, gitleaks 8.30.1, 2026-10-27).
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb   # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      # AEGIS secret-scan r1 F1: a PR must not be able to switch the scan off from inside the repo. gitleaks reads
      # .gitleaks.toml (custom rules/allowlist) and .gitleaksignore from the scanned tree, and honours inline
      # gitleaks:allow comments. The preflight below is the control for the two files (tested: pointing
      # --gitleaks-ignore-path at an empty dir did NOT stop a root .gitleaksignore in 8.30.1, so it is kept only as
      # belt-and-braces); --ignore-gitleaks-allow is the control for inline comments (tested). Default rules only.
      - name: Refuse in-repo gitleaks overrides
        run: |
          set -euo pipefail
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then echo "::error::$f is present; in-repo gitleaks overrides are not allowed (AEGIS F1)"; exit 1; fi
          done
      - name: Scan the full history
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-no-ignore"
          # -v with --redact names rule, file and commit but never the secret (AEGIS r1 F3: verified)
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact -v --exit-code 1 \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-no-ignore" .
